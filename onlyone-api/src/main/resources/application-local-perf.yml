# =============================================================
# 로컬 성능 테스트 환경 설정 (profile: local-perf)
# Docker 인프라(MySQL, Redis, ES) + 로컬 앱 실행
# dev 프로필 수준의 리소스 설정, 디버그 로깅 OFF
# =============================================================

# --- 데이터소스 (HikariCP 확장 풀) ---
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/onlyone?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 100
      minimum-idle: 50
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      auto-commit: false

  # JPA: 스키마 검증만, 배치 INSERT/UPDATE
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true

  # Redis (Docker 호스트 포트 6479 → 컨테이너 6379)
  data:
    redis:
      host: localhost
      port: 6479
      password:
      lettuce:
        pool:
          max-active: 50
          max-idle: 30
          min-idle: 10

  # Elasticsearch
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: changeme

  # 캐시: Redis 기반, TTL 10분
  cache:
    type: redis
    redis:
      time-to-live: 600000

# --- 로깅: INFO (성능 테스트 시 로그 최소화) ---
logging:
  level:
    root: INFO
    com.example.onlyone: INFO
    org.hibernate.SQL: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

# --- Tomcat (부하 테스트용 확장 스레드) ---
server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 20

# --- AWS ---
aws:
  s3:
    region: ap-northeast-2
    bucket: buddkit-image
  cloudfront:
    domain: d1c3fg3ti7m8cn.cloudfront.net

Kakao:
  redirect:
    uri: http://localhost:5173/kakao-callback

# --- Rate Limit 비활성화 (부하 테스트) ---
app:
  rate-limit:
    enabled: false
    requests-per-minute: 60
    auth-requests-per-30s: 10
