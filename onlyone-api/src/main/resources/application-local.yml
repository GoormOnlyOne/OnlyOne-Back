spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/onlyone?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        show_sql: false

  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 2

  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: changeme

  cache:
    type: redis
    redis:
      time-to-live: 600000

logging:
  level:
    root: INFO
    com.example.onlyone: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    org.springframework.security: INFO

server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10

aws:
  s3:
    region: ap-northeast-2
    bucket: buddkit-image
  cloudfront:
    domain: d1c3fg3ti7m8cn.cloudfront.net

Kakao:
  redirect:
    uri: http://localhost:5173/kakao-callback

app:
  rate-limit:
    enabled: false
    requests-per-minute: 60
    auth-requests-per-30s: 10
