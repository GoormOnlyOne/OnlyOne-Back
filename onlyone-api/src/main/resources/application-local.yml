# =============================================================
# 로컬 개발 & 성능 테스트 환경 설정 (profile: local)
# Docker 인프라(MySQL, Redis, ES) + 로컬 앱 실행
# 환경변수 의존 없이 하드코딩 — 이 파일 하나로 즉시 실행
# =============================================================

spring:
  # --- 데이터소스 (HikariCP 확장 풀) ---
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3340/onlyone?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: root
    hikari:
      maximum-pool-size: 400
      minimum-idle: 150
      connection-timeout: 8000
      idle-timeout: 300000
      max-lifetime: 600000
      validation-timeout: 3000
      auto-commit: false

  # JPA: 스키마 자동 업데이트, 배치 INSERT/UPDATE
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
      jakarta.persistence.query.timeout: 5000

  # Redis (Docker: 6379 → 6379)
  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 256
          max-idle: 128
          min-idle: 32

  # Elasticsearch
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: changeme

  # 캐시: Redis 기반, TTL 10분
  cache:
    type: redis
    redis:
      time-to-live: 600000

# --- 로깅: WARN/ERROR만 (부하테스트용) ---
logging:
  level:
    root: error
    com.example.onlyone: error
    org.hibernate.SQL: error
    org.springframework.web: error
    org.springframework.security: error

# --- Tomcat (확장 스레드) ---
server:
  port: 8080
  tomcat:
    threads:
      max: 800
      min-spare: 50
    max-connections: 20000
    accept-count: 1000

# --- AWS ---
aws:
  s3:
    region: ap-northeast-2
    bucket: buddkit-image
  cloudfront:
    domain: d1c3fg3ti7m8cn.cloudfront.net

