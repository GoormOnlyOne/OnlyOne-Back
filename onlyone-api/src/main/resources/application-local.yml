# =============================================================
# 로컬 개발 & 성능 테스트 환경 설정 (profile: local)
# Docker 인프라(MySQL, Redis, ES) + 로컬 앱 실행
# 모든 인프라 접속 정보는 환경변수로 관리 (기본값은 로컬 Docker)
# =============================================================

spring:
  # --- 데이터소스 (HikariCP 확장 풀) ---
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3340}/${DB_NAME:onlyone}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:400}
      minimum-idle: ${HIKARI_MIN_IDLE:150}
      connection-timeout: ${HIKARI_CONN_TIMEOUT:15000}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:600000}
      validation-timeout: ${HIKARI_VALIDATION_TIMEOUT:3000}
      auto-commit: false

  # JPA: 스키마 자동 업데이트, 배치 INSERT/UPDATE
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        show_sql: false
        jdbc:
          batch_size: 30
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        generate_statistics: true
      jakarta.persistence.query.timeout: 30000

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6479}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:5000}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:256}
          max-idle: ${REDIS_POOL_MAX_IDLE:128}
          min-idle: ${REDIS_POOL_MIN_IDLE:32}
          max-wait: ${REDIS_POOL_MAX_WAIT:3000}
        shutdown-timeout: 2000ms

  # Kafka (정산 MQ 기본 브로커)
  kafka:
    default-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      common-config:
        client-id: onlyone-producer
        bootstrap-servers:
          - ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
        transactional-id-prefix: onlyone-tx-
        acks: all
        linger-ms: 5
        batch-size: 16384
      settlement-process-producer-config:
        topic: settlement.process.v1
    consumer:
      common-config:
        group-id: onlyone-settlement
        client-id: onlyone-consumer
        bootstrap-servers:
          - ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
        timeout-ms: "30000"
        fetch-min-bytes: 1
        fetch-max-wait-ms: 500
      user-settlement-ledger-consumer-config:
        topic: user-settlement.result.v1
    security:
      enabled: false

  # MongoDB
  data.mongodb:
    uri: mongodb://${MONGO_USERNAME:root}:${MONGO_PASSWORD:root}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DATABASE:onlyone}?authSource=admin

  # Elasticsearch
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:changeme}

  # 캐시: Redis 기반, TTL 10분
  cache:
    type: redis
    redis:
      time-to-live: 600000

# --- 로깅: 병목 감지 + 디버깅 ---
logging:
  level:
    root: warn
    # ── 앱 코드 ──
    com.example.onlyone: warn
    com.example.onlyone.domain.notification: debug        # 알림 서비스 흐름
    com.example.onlyone.global.sse: debug                 # Servlet SSE 연결/해제
    com.example.onlyone.global.reactive: debug            # WebFlux SSE 연결/해제
    # ── HikariCP (커넥션풀 고갈/대기 감지) ──
    com.zaxxer.hikari: info
    com.zaxxer.hikari.pool.HikariPool: debug              # 풀 상태, leak detection
    # ── Hibernate (슬로우 쿼리 감지) ──
    org.hibernate.SQL: debug                              # 실행 SQL
    org.hibernate.orm.jdbc.bind: off                      # 바인드 파라미터 끔 (노이즈)
    org.hibernate.stat: info                              # 세션 통계 (쿼리 수, 시간)
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: info
    # ── Spring 트랜잭션/웹 ──
    org.springframework.orm.jpa.JpaTransactionManager: debug  # TX 시작/커밋/롤백
    org.springframework.web.servlet.mvc.method.annotation: warn
    org.springframework.security: warn
    # ── Tomcat (스레드풀 포화 감지) ──
    org.apache.coyote.http11: info
    org.apache.catalina.connector: info
    # ── Redis (커넥션 풀/타임아웃) ──
    io.lettuce.core: warn
    io.lettuce.core.protocol: warn
    org.springframework.data.redis: info                  # Redis 명령 실패 시
    # ── MongoDB ──
    org.springframework.data.mongodb: warn
    org.mongodb.driver.protocol.command: warn

# --- Tomcat (확장 스레드) ---
server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:800}
      min-spare: ${TOMCAT_MIN_SPARE:50}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:20000}
    accept-count: ${TOMCAT_ACCEPT_COUNT:1000}

# --- AWS ---
aws:
  s3:
    region: ${AWS_S3_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:buddkit-image}
  cloudfront:
    domain: ${AWS_CLOUDFRONT_DOMAIN:d1c3fg3ti7m8cn.cloudfront.net}

