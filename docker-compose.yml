services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: onlyone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: onlyone
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./onlyone-api/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max_connections=800
      - --innodb_buffer_pool_size=6G
      - --innodb_buffer_pool_instances=8
      - --innodb_flush_log_at_trx_commit=2
      - --innodb_lock_wait_timeout=5
      - --innodb_thread_concurrency=0
      - --innodb_io_capacity=4000
      - --innodb_io_capacity_max=20000
      - --innodb_read_io_threads=16
      - --innodb_write_io_threads=16
      - --innodb_redo_log_capacity=1G
      - --innodb_log_buffer_size=128M
      - --sync_binlog=0
      - --thread_cache_size=400
      - --sort_buffer_size=4M
      - --join_buffer_size=4M
      - --tmp_table_size=128M
      - --max_heap_table_size=128M
      - --table_open_cache=4000
      - --innodb_adaptive_hash_index=ON
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '6'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  # Redis Cache & Session
  redis:
    image: redis:7-alpine
    container_name: onlyone-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./onlyone-api/src/main/resources/redis:/usr/local/etc/redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru --io-threads 4 --save ""
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M

  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.1
    container_name: onlyone-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - cluster.name=onlyone-cluster
    ports:
      - "127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"
      - "127.0.0.1:9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./onlyone-api/src/main/resources/elasticsearch:/usr/share/elasticsearch/config/analysis
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1200M
        reservations:
          cpus: '0.5'
          memory: 512M

  # MongoDB (알림 저장소 비교용 — app.notification.storage=mongodb)
  mongodb:
    image: mongo:7.0
    container_name: onlyone-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: onlyone
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    command: ["mongod", "--wiredTigerCacheSizeGB", "2.5", "--auth"]
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "root", "-p", "root", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - mongodb
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # RabbitMQ (알림 이벤트 버스 비교용 — app.notification.event-bus=rabbitmq)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: onlyone-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - onlyone-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - rabbitmq
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ========== Monitoring (--profile monitoring) ==========

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: onlyone-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-remote-write-receiver'
    networks:
      - onlyone-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: onlyone-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - onlyone-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # MySQL Exporter - MySQL Metrics
  mysql-exporter:
    image: prom/mysqld-exporter:latest
    container_name: onlyone-mysql-exporter
    restart: unless-stopped
    ports:
      - "9104:9104"
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DB_PASSWORD:-root}
    command:
      - '--mysqld.address=mysql:3306'
      - '--mysqld.username=root'
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - onlyone-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Elasticsearch Exporter - ES Metrics
  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:latest
    container_name: onlyone-es-exporter
    restart: unless-stopped
    ports:
      - "9114:9114"
    command:
      - '--es.uri=http://elasticsearch:9200'
      - '--es.all'
      - '--es.indices'
      - '--es.shards'
    environment:
      ES_USERNAME: ${ELASTICSEARCH_USERNAME:-elastic}
      ES_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - onlyone-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Redis Exporter - Redis Metrics
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: onlyone-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - onlyone-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 64M

networks:
  onlyone-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  elasticsearch_data:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
