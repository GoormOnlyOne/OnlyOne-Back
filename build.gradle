plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
    set('querydslVersion', '5.1.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.20.2"
    }
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    compileOnly 'org.projectlombok:lombok'
    // developmentOnly 'org.springframework.boot:spring-boot-devtools'  // 성능 테스트를 위해 비활성화
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.11.5'
    // Jwt
    implementation group: 'com.auth0', name: 'java-jwt', version: '3.14.0'
    // Oauth2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.4'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.4'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.4'
    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-jackson'
    //websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter'
    //fcm
    implementation 'com.google.firebase:firebase-admin:9.5.0'
    // S3
    implementation 'software.amazon.awssdk:s3:2.32.11'
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
    
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    // jpa 쿼리 확인 (성능 테스트를 위해 비활성화)
    // implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // querydsl
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 모니터링
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    
    // 트레이싱 (Jaeger/OpenTelemetry) - 수정된 설정
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.opentelemetry.semconv:opentelemetry-semconv'
}

// QueryDSL 설정 (수정됨)
def querydslDir = layout.buildDirectory.dir('generated/querydsl')

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

clean {
    delete querydslDir
}

// 나머지는 기존과 동일
// 40K RPS 대응 JVM + 네트워크 최적화
tasks.named('bootRun') {
    jvmArgs = [
        // M3 MacBook 최적화 메모리 설정 - SSE 3000 연결 대응
        '-Xms3g',                              // 시작 힙 3GB
        '-Xmx8g',                              // 최대 힙 8GB (SSE 대용량 처리)
        '-XX:+UseG1GC',                        // G1GC 사용 (ZGC 대신)
        '-XX:MaxGCPauseMillis=20',             // 현실적 GC 일시정지
        
        // 성능 최적화 (macOS 호환)
        '-XX:+UseStringDeduplication',         // 문자열 중복 제거
        '-XX:+OptimizeStringConcat',           // 문자열 연결 최적화
        
        // CPU 집약적 최적화 (8코어 활용)
        '-XX:ConcGCThreads=8',                 // GC 병렬 스레드 8개
        '-XX:ParallelGCThreads=8',             // 병렬 GC 스레드 8개
        '-XX:G1HeapRegionSize=16m',            // G1 힙 영역 크기
        
        // 네트워크 최적화
        '-Djava.net.preferIPv4Stack=true',
        '-Djava.net.useSystemProxies=false',
        '-Djava.net.SocketInputStream.bufferSize=65536',   // 64KB
        '-Djava.net.SocketOutputStream.bufferSize=65536',  // 64KB
        
        // Virtual Thread 최적화
        '-Djdk.virtualThreadScheduler.parallelism=8',      // 8코어 활용
        '-Djdk.virtualThreadScheduler.maxPoolSize=128',    // 최대 캐리어 스레드
        
        // 메모리 최적화
        '-XX:MaxDirectMemorySize=1g',          // 다이렉트 메모리 1GB
        
        // 컴파일러 최적화
        '-XX:+TieredCompilation',              // 계층 컴파일
        '-XX:TieredStopAtLevel=4',             // 최고 레벨까지
        '-XX:ReservedCodeCacheSize=128m'       // 코드 캐시 128MB
    ]
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // notification 관련 테스트 임시 제외
    exclude '**/AppNotificationControllerTest.class'
    exclude '**/FcmServiceTest.class'
    exclude '**/AppNotificationTypeRepositoryTest.class'
}

jacoco {
    toolVersion = "0.8.13"
}

test {
    jvmArgs += ["-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }.absolutePath}"]
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        xml.outputLocation = layout.buildDirectory.file('jacoco/jacoco.xml')
    }
    
    // 제외할 패키지/클래스 설정
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/configuration/**',
                    '**/dto/**',
                    '**/entity/**',
                    '**/domain/**/entity/**',
                    '**/*Application*',
                    '**/exception/**',
                    '**/global/exception/**',
                    '**/util/**',
                    '**/common/**',
            ])
        }))
    }
}

// 테스트 커버리지 최소 기준 설정
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }

        rule {
            enabled = true
            element = 'CLASS'
            includes = ['com.example.onlyone.domain.*.service.*']

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }
    }
}
