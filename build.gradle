plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springCloudVersion', "2025.0.0")
    set('querydslVersion', '5.1.0')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        mavenBom "org.testcontainers:testcontainers-bom:1.20.2"
    }
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-logging'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.11.5'
    // Jwt
    implementation group: 'com.auth0', name: 'java-jwt', version: '3.14.0'
    // Oauth2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.4'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.4'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.4'
    // OpenFeign
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'io.github.openfeign:feign-jackson'
    //websocket
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter'
    // S3
    implementation 'software.amazon.awssdk:s3:2.32.11'
    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers'
    // jpa 쿼리 확인 (일시적 비활성화 - Jaeger와 충돌)
    // implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.0'

    // querydsl
    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 모니터링 (중복 제거됨)
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    
    // OTLP + Jaeger 트레이싱 (OpenTelemetry 기반)
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'io.micrometer:micrometer-tracing'
    
    // 추가 메트릭 및 트레이싱
    implementation 'net.ttddyy.observation:datasource-micrometer-spring-boot:1.0.5'
}

// QueryDSL 설정 (수정됨)
def querydslDir = layout.buildDirectory.dir('generated/querydsl')

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}

sourceSets {
    main {
        java {
            srcDirs += [querydslDir]
        }
    }
}

clean {
    delete querydslDir
}

// 나머지는 기존과 동일
tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    // notification 관련 테스트 임시 제외
    exclude '**/AppNotificationControllerTest.class'
    exclude '**/FcmServiceTest.class'
    exclude '**/AppNotificationTypeRepositoryTest.class'
}

jacoco {
    toolVersion = "0.8.13"
}

test {
    jvmArgs += ["-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }.absolutePath}"]
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
        xml.outputLocation = layout.buildDirectory.file('jacoco/jacoco.xml')
    }
    
    // 제외할 패키지/클래스 설정
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/config/**',
                    '**/configuration/**',
                    '**/dto/**',
                    '**/entity/**',
                    '**/domain/**/entity/**',
                    '**/*Application*',
                    '**/exception/**',
                    '**/global/exception/**',
                    '**/util/**',
                    '**/common/**',
            ])
        }))
    }
}

// 테스트 커버리지 최소 기준 설정
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }

        rule {
            enabled = true
            element = 'CLASS'
            includes = ['com.example.onlyone.domain.*.service.*']

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.75
            }
        }
    }
}

// JVM 최적화 설정 (M3 MacBook 16GB 기준)
bootRun {
    jvmArgs = [
        // 메모리 설정 (10,000명 대응 - 12GB 사용)
        '-Xms8g',
        '-Xmx12g',
        
        // G1GC 사용 (대용량 힙에 최적)
        '-XX:+UseG1GC',
        '-XX:MaxGCPauseMillis=100',
        '-XX:G1HeapRegionSize=16m',
        
        // GC 로깅 (JDK 21 호환)
        '-Xlog:gc*:gc.log:time,pid,tid',
        
        // JIT 컴파일러 최적화
        '-XX:+TieredCompilation',
        '-XX:TieredStopAtLevel=4',
        
        // 스레드 성능 최적화 (JDK 21 호환)
        '-XX:+UnlockExperimentalVMOptions',
        
        // 네이티브 메모리 추적
        '-XX:NativeMemoryTracking=summary',
        
        // 압축 OOP 활성화 (힙이 32GB 미만일 때)
        '-XX:+UseCompressedOops',
        
        // Apple Silicon 최적화
        '-Djava.awt.headless=true',
        '-Dfile.encoding=UTF-8',
        
        // 성능 모니터링
        '-Dcom.sun.management.jmxremote=true',
        '-Dcom.sun.management.jmxremote.port=9999',
        '-Dcom.sun.management.jmxremote.authenticate=false',
        '-Dcom.sun.management.jmxremote.ssl=false'
    ]
}
