events {
    worker_connections 10000;  # 동시 연결 수 (SSE 다수 지원)
}

http {
    # 업스트림 서버 정의 (3개 애플리케이션 서버)
    upstream app_servers {
        # IP Hash: 같은 클라이언트는 같은 서버로 라우팅 (SSE 연결 유지)
        # SSE 같은 stateful 연결을 위해 ip_hash 사용
        # 일반 API 테스트를 위해서는 아래 주석을 해제하고 ip_hash를 주석 처리
        ip_hash;

        # Round Robin (균등 분산): ip_hash를 주석 처리하면 자동으로 적용됨
        # least_conn;  # 연결 수 기반 분산

        server app1:8080 max_fails=0;  # 헬스체크 비활성화 (부하 테스트용)
        server app2:8080 max_fails=0;
        server app3:8080 max_fails=0;
    }

    # 로그 포맷 (upstream 서버 정보 포함)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream: $upstream_addr '
                    'upstream_response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # 클라이언트 요청 크기 제한
        client_max_body_size 64M;

        # 기본 프록시 타임아웃
        proxy_read_timeout 1800s;    # 30분 (SSE 장시간 연결)
        proxy_send_timeout 1800s;
        proxy_connect_timeout 10s;

        # 버퍼링 설정
        proxy_buffering off;          # SSE는 버퍼링 비활성화

        # HTTP/1.1 및 Connection 헤더 유지
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 클라이언트 정보 전달
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 엔드포인트 특별 처리 (버퍼링 완전 비활성화)
        location /api/sse {
            proxy_pass http://app_servers;

            # SSE 전용 설정
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;

            # 타임아웃 연장
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;

            # X-Accel-Buffering 비활성화
            proxy_set_header X-Accel-Buffering no;
        }

        # 일반 API 엔드포인트
        location / {
            proxy_pass http://app_servers;
        }

        # 헬스체크 (Nginx 자체)
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # 업스트림 서버 상태 확인 (프록시)
        location /actuator/health {
            proxy_pass http://app_servers;
        }
    }
}
