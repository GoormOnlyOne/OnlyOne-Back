name: CI/CD with Docker & ASG

on:
  push:
    branches: [ "stage" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Make application-prod.yml
        run: |
          mkdir -p ./src/main/resources/firebase
          touch ./src/main/resources/application.yml
          echo "${{ secrets.APPLICATION_STAGE }}" > ./src/main/resources/application.yml

      - name: create-json
        uses: jsdaniell/create-json@v1.2.2
        with:
          name: "service-account.json"
          json: ${{ secrets.FIREBASE_ACCOUNT }}
          dir: './src/main/resources/firebase'

      - name: Build with Gradle
        run: |
          cd ./
          chmod +x ./gradlew
          ./gradlew build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Server build & push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_REPO }}:latest

      - name: AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-northeast-2

      - name: Auto Scaling Group Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name onlyone-buddkit-back-asg \
            --strategy "Rolling" \
            --preferences "MinHealthyPercentage=50"